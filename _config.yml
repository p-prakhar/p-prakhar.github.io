title: "Prakhar :)"
description: >-
  Systems engineer writing about C++, Linux, distributed storage, travel,
  and life.
url: "https://p-prakhar.github.io"
baseurl: ""
repository: "p-prakhar/p-prakhar.github.io"
lang: en
timezone: UTC

author:
  name: Prakhar Pandey
  email: 3.14prakhar@gmail.com
  github: p-prakhar
  linkedin: p-prakhar

permalink: /blog/:title

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/
  updates:
    output: true
    permalink: /now/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: updates
    values:
      layout: update

exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - docs/
  - test/
  - lib/
  - site
  - vendor/
  - .bundle/
  - .superpowers/
  - "*.log"
