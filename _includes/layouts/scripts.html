<!-- GitHub Buttons -->
<script async defer src="https://buttons.github.io/buttons.js"></script>

<!-- jQuery CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<!-- Popper.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js"></script>

<!-- Bootstrap JS CDN -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<!-- wow.js CDN & Activation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.js"></script>
<script> new WOW().init(); </script>

<!-- Initialize all tooltips -->
<script>
$(function () {
    $('[data-toggle="tooltip"]').tooltip()
})
</script>

<!-- Scroll Animations and Micro-interactions -->
<script>
// Scroll-triggered animations
document.addEventListener('DOMContentLoaded', function() {
    // Intersection Observer for scroll animations
    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('animate-in');
            }
        });
    }, observerOptions);

    // Observe elements for animation
    document.querySelectorAll('.wow, .project-card-wrapper, .post-card-wrapper').forEach(el => {
        observer.observe(el);
    });

    // Parallax effect for background
    let lastScrollY = window.scrollY;

    window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        const scrollDirection = currentScrollY > lastScrollY ? 'down' : 'up';

        // Subtle parallax for 3D canvas
        if (document.getElementById('canvas-container')) {
            const canvas = document.getElementById('canvas-container');
            const parallaxOffset = currentScrollY * 0.5;
            canvas.style.transform = `translateY(${parallaxOffset}px)`;
        }

        lastScrollY = currentScrollY;
    });

    // Mouse movement parallax for hero section
    document.addEventListener('mousemove', (e) => {
        const heroSection = document.querySelector('.hero-section');
        if (heroSection) {
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            const moveX = (mouseX - 0.5) * 20;
            const moveY = (mouseY - 0.5) * 20;

            heroSection.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }
    });

    // Typing effect for terminal header
    const terminalHeader = document.querySelector('.terminal-header');
    if (terminalHeader) {
        const text = terminalHeader.textContent;
        terminalHeader.textContent = '';
        let i = 0;

        function typeWriter() {
            if (i < text.length) {
                terminalHeader.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }

        setTimeout(typeWriter, 1000);
    }

    // Pulse animation for profile image
    const profileImage = document.querySelector('.profile-image');
    if (profileImage) {
        setInterval(() => {
            profileImage.style.boxShadow = `0 0 20px rgba(0, 255, 136, ${0.3 + Math.random() * 0.3})`;
        }, 2000);
    }

    // Navbar scroll behavior
    let lastScrollTop = 0;
    const navbar = document.querySelector('nav');

    window.addEventListener('scroll', () => {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

        if (scrollTop > lastScrollTop && scrollTop > 100) {
            // Scrolling down & past 100px
            navbar.classList.add('hidden');
        } else {
            // Scrolling up or at top
            navbar.classList.remove('hidden');
        }

        if (scrollTop > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }

        lastScrollTop = scrollTop;
    });

    // Active navigation link highlighting
    const navLinks = document.querySelectorAll('.nav-links a');
    const sections = document.querySelectorAll('section, .page-content');

    function setActiveLink() {
        const scrollPosition = window.scrollY + 100;

        sections.forEach(section => {
            const sectionTop = section.offsetTop;
            const sectionHeight = section.offsetHeight;
            const sectionId = section.getAttribute('id');

            if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${sectionId}`) {
                        link.classList.add('active');
                    }
                });
            }
        });
    }

    window.addEventListener('scroll', setActiveLink);

    // Smooth scroll for navigation links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });

    // Add loading animation for cards
    const cards = document.querySelectorAll('.project.card, .post.card');
    cards.forEach((card, index) => {
        card.style.animationDelay = `${index * 0.1}s`;
        card.classList.add('fade-in-up');
    });

    // Touch device optimizations
    if ('ontouchstart' in window) {
        // Reduce motion for touch devices
        document.documentElement.style.setProperty('--animation-duration', '0.2s');

        // Add touch feedback
        document.querySelectorAll('.project.card, .post.card, .contact-bubble').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.98)';
            });

            el.addEventListener('touchend', () => {
                el.style.transform = '';
            });
        });
    }

    // Performance optimizations for mobile
    let ticking = false;
    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                // Throttled scroll handlers
                const scrolled = window.pageYOffset;
                const rate = scrolled * -0.5;

                // Parallax only on desktop
                if (window.innerWidth > 768) {
                    const canvas = document.getElementById('canvas-container');
                    if (canvas) {
                        canvas.style.transform = `translateY(${rate}px)`;
                    }
                }

                ticking = false;
            });
            ticking = true;
        }
    });
});

// Add CSS animations dynamically
const style = document.createElement('style');
style.textContent = `
    .animate-in {
        animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .fade-in-up {
        opacity: 0;
        animation: fadeInUp 0.8s ease-out forwards;
    }

    .project-card-wrapper:hover .project.card {
        animation: bounce 0.6s ease;
    }

    .post-card-wrapper:hover .post.card {
        animation: slideRight 0.4s ease;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-10px);
        }
        60% {
            transform: translateY(-5px);
        }
    }

    @keyframes slideRight {
        0% {
            transform: translateX(0);
        }
        50% {
            transform: translateX(5px);
        }
        100% {
            transform: translateX(0);
        }
    }

    .hero-section {
        transition: transform 0.1s ease;
    }
`;
document.head.appendChild(style);
</script>
