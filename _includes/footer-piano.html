<div class="footer-piano" data-piano>
  <p class="footer-piano__label">A tiny piano. Press a key.</p>
  <div class="piano-keys" role="group" aria-label="Playable piano keys">
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="60" aria-label="Play C"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="62" aria-label="Play D"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="64" aria-label="Play E"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="65" aria-label="Play F"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="67" aria-label="Play G"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="69" aria-label="Play A"></button>
    <button class="piano-key piano-key--white" type="button" data-piano-key data-midi="71" aria-label="Play B"></button>

    <button class="piano-key piano-key--black piano-key--black-1" type="button" data-piano-key data-midi="61" aria-label="Play C sharp"></button>
    <button class="piano-key piano-key--black piano-key--black-2" type="button" data-piano-key data-midi="63" aria-label="Play D sharp"></button>
    <button class="piano-key piano-key--black piano-key--black-3" type="button" data-piano-key data-midi="66" aria-label="Play F sharp"></button>
    <button class="piano-key piano-key--black piano-key--black-4" type="button" data-piano-key data-midi="68" aria-label="Play G sharp"></button>
    <button class="piano-key piano-key--black piano-key--black-5" type="button" data-piano-key data-midi="70" aria-label="Play A sharp"></button>
  </div>
  <p class="visually-hidden" aria-live="polite" data-piano-status></p>
</div>
