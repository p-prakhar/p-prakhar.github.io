<div class="project-card-item my-3 wow animated fadeIn" data-wow-delay=".15s">
  <div class="project-card-wrapper">
    <a href="{{ project_url }}" class="project card text-themed" {%- if external and site.open_new_tab -%} target="_blank" {%- endif -%}>
      {%- if project_img -%}
      <div class="card-image-container">
        <img id="{{ project_id }}-img" class="card-img-top" src="{{ project_img }}" alt="{{ project_name }}" />
      </div>
      {%- endif -%}
      <div class="card-body">
        <div class="card-header-section">
          <h5 id="{{ project_id }}-name" class="card-title">
              {%- if project_type == "remote" -%}
              <i class="fab fa-github" data-toggle="tooltip" data-placement="bottom" data-delay="250" title="GitHub Repository"></i>
              {%- endif -%}
            {{ project_name }}
          </h5>
          <div class="card-glow-effect"></div>
        </div>
        <p id="{{ project_id }}-desc" class="card-text">{{ project_desc }}</p>
        <div class="tools-section">
          {%- for tool in project_tools -%}
          <span class="badge badge-pill text-primary border border-primary tool-badge">{{ tool }}</span>
          {%- endfor -%}
        </div>
      </div>
      <div class="card-footer-decoration">
        <div class="decoration-line"></div>
      </div>
    </a>
  </div>
</div>
