<!DOCTYPE html>
<html lang="en" class="portfolio-3d h-100">

{% include layouts/head.html %}

<body class="portfolio-3d-body h-100">

  <!-- The Canvas Wrapper (smaller, more subtle for content pages) -->
  <div id="canvas-container"></div>

  <!-- Navbar -->
  <nav>
    <a href="/" class="logo">Prakhar<span>:)</span></a>
    <ul class="nav-links">
      <li><a href="/projects/">Projects</a></li>
      <li><a href="/blog/">Blog</a></li>
    </ul>
    <div class="hamburger">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>
  </nav>

  <!-- Page Content Container -->
  <div class="page-content">
    <div class="content-card">
      <main class="container-fluid">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-xl-6">
            {{ content }}
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Three.js Library (Simplified version for content pages) -->
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>

  <script>
    // Simplified 3D scene for content pages - more subtle
    window.addEventListener('load', function() {
      initSubtleThreeJS();
    });

    function initSubtleThreeJS() {
      const container = document.getElementById('canvas-container');

      if (!container) return;

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x1a0b2e, 0.005); // Lighter fog for content pages

      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 15; // Further back for subtlety

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Minimal lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      // Floating particles
      const particlesGeometry = new THREE.BufferGeometry();
      const particlesCount = 800;
      const posArray = new Float32Array(particlesCount * 3);

      for(let i = 0; i < particlesCount * 3; i++) {
        posArray[i] = (Math.random() - 0.5) * 120;
      }

      particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

      const particlesMaterial = new THREE.PointsMaterial({
        size: 0.02,
        color: 0x00ff88,
        transparent: true,
        opacity: 0.5
      });

      const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
      scene.add(particlesMesh);

      // Stars background
      const starGeo = new THREE.BufferGeometry();
      const starCount = 1200;
      const starPos = new Float32Array(starCount * 3);
      for(let i = 0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 200;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true,
        opacity: 0.8
      });
      const starSystem = new THREE.Points(starGeo, starMat);
      scene.add(starSystem);

      // Gentle floating music notes (fewer)
      const notes = [];
      const symbols = ['♪', '♫'];

      function createNoteSprite(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.font = 'bold 40px Arial';
        ctx.fillStyle = '#ffffff'; // White instead of green
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 32, 32);

        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        return new THREE.Sprite(mat);
      }

      for(let i = 0; i < 3; i++) {
        const symbol = symbols[i % symbols.length];
        const sprite = createNoteSprite(symbol);

        sprite.position.set(
          (Math.random() - 0.5) * 50,
          (Math.random() - 0.5) * 25 - 12,
          (Math.random() - 0.5) * 35
        );
        sprite.scale.set(0.2, 0.2, 0.2);

        scene.add(sprite);
        notes.push({
          mesh: sprite,
          speed: 0.002 + Math.random() * 0.003,
          wobbleOffset: Math.random() * 10
        });
      }

      // Animation loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // Gentle particle movement
        particlesMesh.rotation.y += 0.0003;

        // Star field rotation
        starSystem.rotation.y += 0.0001;

        // Floating notes
        notes.forEach(n => {
          n.mesh.position.y += n.speed;
          n.mesh.position.x += Math.sin(time * 1 + n.wobbleOffset) * 0.002;
          if(n.mesh.position.y > 15) n.mesh.position.y = -15;
        });

        renderer.render(scene, camera);
      }

      animate();

      // Resize handler
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // Hamburger Menu Functionality
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.querySelector('.hamburger');
      const navLinks = document.querySelector('.nav-links');

      if (hamburger && navLinks) {
        hamburger.addEventListener('click', function() {
          navLinks.classList.toggle('active');
          hamburger.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
          link.addEventListener('click', function() {
            navLinks.classList.remove('active');
            hamburger.classList.remove('active');
          });
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
          if (!event.target.closest('nav')) {
            navLinks.classList.remove('active');
            hamburger.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
